[project]
name = "receipt"
version = "0.1.0"
description = "Run a command, and get a receipt for what it actually touched -- not just what it was asked to do."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["verification", "audit", "agents", "provenance", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

urls.Source = "https://github.com/MaXiMo000/receipt"

[project.scripts]
receipt = "receipt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["receipt*"]
