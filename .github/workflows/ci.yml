name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # jsonschema is installed here only, as a test-only tool for
    # TestSchema -- receipt itself stays zero-dependency (pip install -e .
    # alone, no extras) for anyone actually using it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor, not just today.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . jsonschema
      - run: python tests/test_receipt.py

  package:
    # Build and install the distribution on every commit, not only at
    # release -- a packaging break (missing package data, wrong entry
    # point) is invisible to `pip install -e .` and only shows up in the
    # wheel. Runs a real end-to-end scope check with the installed CLI,
    # cold, with no dev checkout on PYTHONPATH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run a real scope check with it
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/receipt run --task "smoke test" --declare out.txt \
            --dir /tmp --out /tmp/receipts \
            -- /tmp/v/bin/python -c "open('/tmp/out.txt', 'w').write('x')"
          test -f /tmp/receipts/*.json || (echo "no receipt written" && exit 1)
          test "$(/tmp/v/bin/python -c 'import receipt; print(receipt.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
